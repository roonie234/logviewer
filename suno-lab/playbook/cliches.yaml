  - {phrase: "whispers in the", weight: 3}
  - {phrase: "ethereal", weight: 3}
  - {phrase: "labyrinth", weight: 3}
  - {phrase: "soul on fire", weight: 3}
  - {phrase: "fire within", weight: 3}
  - {phrase: "stars align", weight: 3}
  - {phrase: "electric dreams", weight: 3}
  - {phrase: "neon lights", weight: 3}
  - {phrase: "city lights", weight: 2}
