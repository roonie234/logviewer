# Phrases that make lyrics and style prompts read as machine-written.
# weight: how strongly it signals "generic AI lyric" (1 = mild, 3 = dead giveaway).
# Matching is case-insensitive on whole words / phrases. Add to this as we learn.

lyric_cliches:
  # dead giveaways
  - {phrase: "neon", weight: 3}
  - {phrase: "echoes", weight: 3}
  - {phrase: "echoes of", weight: 3}
  - {phrase: "shadows dance", weight: 3}
  - {phrase: "tapestry", weight: 3}
  - {phrase: "symphony of", weight: 3}
  - {phrase: "kaleidoscope", weight: 3}
  - {phrase: "ignite", weight: 3}
  - {phrase: "ignite the", weight: 3}
  - {phrase: "embers", weight: 3}
  - {phrase: "we rise", weight: 3}
