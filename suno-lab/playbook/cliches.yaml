# Words that add nothing to a Style prompt: they describe quality or reaction,
# not sound. Replace them with instruments, playing style, production, era, space.
generic_style_words:
  - epic
  - emotional
  - catchy
  - beautiful
  - amazing
  - powerful
  - uplifting
  - banger
  - viral
  - high quality
  - masterpiece
  - professional
  - best
  - perfect
  - awesome
  - incredible
  - stunning
  - vibes
  - modern

